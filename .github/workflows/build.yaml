name: Build OpenCV4NodeJS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Install OpenCV dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libopencv-dev \
          pkg-config \
          libavcodec-dev \
          libavformat-dev \
          libswscale-dev \
          libgtk-3-dev \
          libv4l-dev \
          libatlas-base-dev \
          gfortran \
          python3-dev

    - name: Build OpenCV4NodeJS
      run: |
        npm install
        npm run build

    - name: Archive built package
      run: |
        mkdir -p dist
        cp -r ./build/* ./dist/
      # 上传构建产物作为 Artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: opencv4nodejs-build
        path: ./dist
